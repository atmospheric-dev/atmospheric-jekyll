<!-- Supabase: просмотры и оценки -->
<script>
(function () {
  var SUPABASE_URL = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';

  function visitorId() {
    var k = 'atmos_visitor';
    var v = localStorage.getItem(k);
    if (!v) {
      v = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(k, v);
    }
    return v;
  }

  async function rpc(fn, body) {
    var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('rpc ' + fn + ': ' + res.status);
    return res.json();
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var box = document.querySelector('.seal-rating');
    if (!box) return;

    var album = box.dataset.album;
    var path = window.location.pathname;
    var crows = box.querySelector('.seal-crows');
    var avgNum = box.querySelector('.seal-avg-num');
    var viewsNum = box.querySelector('.seal-views-num');

    /* ---------- просмотры ---------- */
    try {
      var seen = sessionStorage.getItem('atmos_view_' + path);
      if (!seen) {
        var c = await rpc('bump_view', { p_path: path });
        viewsNum.textContent = c;
        sessionStorage.setItem('atmos_view_' + path, '1');
      } else {
        var s0 = await rpc('album_stats', { p_album: album });
        viewsNum.textContent = (s0 && s0[0] && s0[0].views) || 0;
      }
    } catch (e) { console.warn(e); }

    /* ---------- отрисовка ворон ---------- */
    function paint(avg, votes) {
      if (!votes) {
        crows.querySelectorAll('.crow').forEach(function (btn) {
          btn.classList.remove('is-on');
        });
        avgNum.textContent = 'нет оценок';
        return;
      }

      var filled = Math.floor(avg + 0.5);

      crows.querySelectorAll('.crow').forEach(function (btn) {
        var n = parseInt(btn.dataset.value, 10);
        btn.classList.toggle('is-on', n <= filled);
      });

      avgNum.textContent = avg.toFixed(1).replace('.', ',') + ' · ' + votes + ' гл.';
    }

    async function refresh() {
      try {
        var s = await rpc('album_stats', { p_album: album });
        var row = s && s[0];
        if (row) {
          if (viewsNum.textContent === '—') viewsNum.textContent = row.views || 0;
          paint(row.avg_value ? parseFloat(row.avg_value) : 0, Number(row.votes) || 0);
        }
      } catch (e) { console.warn(e); }
    }
    refresh();

    /* ---------- голосование ---------- */
    crows.querySelectorAll('.crow').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var value = parseInt(btn.dataset.value, 10);
        try {
          await fetch(SUPABASE_URL + '/rest/v1/ratings?on_conflict=album,visitor', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=minimal'
            },
            body: JSON.stringify({ album: album, visitor: visitorId(), value: value })
          });
          localStorage.setItem('atmos_rating_' + album, value);
          await refresh();
        } catch (e) { console.warn(e); }
      });
    });
  });
})();
</script>
