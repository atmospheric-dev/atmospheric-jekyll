{%- assign album_key = page.name | default: page.slug | replace: '.md', '' -%}
<div class="seal-rating" data-album="{{ album_key }}">
  <div class="seal-stats">
    <span class="seal-views" title="Просмотры">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
      <span class="seal-views-num">—</span>
    </span>

    <span class="seal-crows" role="radiogroup" aria-label="Оценка от 1 до 5">
      {% for i in (1..5) %}
        <button type="button" class="crow" data-value="{{ i }}"
                aria-label="Поставить {{ i }} из 5"></button>
      {% endfor %}
    </span>

    <span class="seal-avg"><span class="seal-avg-num">нет оценок</span></span>
  </div>
</div>
