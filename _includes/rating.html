{%- assign album_key = page.slug | default: page.name | replace: '.md', '' -%}
<div class="seal-rating" data-album="{{ album_key }}">
  <div class="seal-stats">
    <span class="seal-views" title="Просмотры">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.6">
        <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
      <span class="seal-views-num">—</span>
    </span>

    <span class="seal-leaves" role="radiogroup" aria-label="Оценка от 1 до 5">
      {% for i in (1..5) %}
        <button type="button" class="seal-leaf" data-value="{{ i }}"
                aria-label="Поставить {{ i }} из 5">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M12 1.6 14 6l4.4-1.2L16.4 9l3.6 2.2-4.2 1.4 1 4.2-3.6-2.4L12 19l-1.2-4.6-3.6 2.4 1-4.2L4 11.2 7.6 9 5.6 4.8 10 6z"/>
          </svg>
        </button>
      {% endfor %}
    </span>

    <span class="seal-avg"><span class="seal-avg-num">нет оценок</span></span>
  </div>
</div>
