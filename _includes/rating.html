{%- assign album_key = page.name | default: page.slug | replace: '.md', '' -%}
<div class="seal-rating" data-album="{{ album_key }}">
  <div class="seal-stats">
    <span class="seal-views" title="Просмотры">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
      <span class="seal-views-num">—</span>
    </span>

    <span class="seal-crows" role="radiogroup" aria-label="Оценка от 1 до 5">
      <svg class="crow-branch" viewBox="0 0 160 78" aria-hidden="true">
        <!-- ветка -->
        <path class="crow-branch-path"
              d="M2 62 C 22 58, 38 66, 58 62 C 78 58, 96 64, 116 60 C 132 57, 148 60, 158 56 L 158 62 C 148 66, 132 63, 116 66 C 96 70, 78 64, 58 68 C 38 72, 22 64, 2 68 Z"/>

        <!-- ворона: тело, голова, клюв, хвост -->
        <g class="crow" data-value="1" transform="translate(6 0)">
          <path d="M14 44 C 14 38, 18 34, 22 34 L 30 30 C 33 28, 36 29, 37 31 L 38 33 L 43 33 L 44 35 L 38 36 L 37 39
                   C 34 41, 32 44, 32 48 L 34 54 L 30 54 L 28 48 L 20 49 L 19 54 L 15 54 L 17 47 C 15 46, 14 45, 14 44 Z"/>
        </g>
        <g class="crow" data-value="2" transform="translate(36 0)">
          <path d="M14 44 C 14 38, 18 34, 22 34 L 30 30 C 33 28, 36 29, 37 31 L 38 33 L 43 33 L 44 35 L 38 36 L 37 39
                   C 34 41, 32 44, 32 48 L 34 54 L 30 54 L 28 48 L 20 49 L 19 54 L 15 54 L 17 47 C 15 46, 14 45, 14 44 Z"/>
        </g>
        <g class="crow" data-value="3" transform="translate(66 0)">
          <path d="M14 44 C 14 38, 18 34, 22 34 L 30 30 C 33 28, 36 29, 37 31 L 38 33 L 43 33 L 44 35 L 38 36 L 37 39
                   C 34 41, 32 44, 32 48 L 34 54 L 30 54 L 28 48 L 20 49 L 19 54 L 15 54 L 17 47 C 15 46, 14 45, 14 44 Z"/>

        <g class="crow" data-value="4" transform="translate(96 0)">
          <path d="M14 44 C 14 38, 18 34, 22 34 L 30 30 C 33 28, 36 29, 37 31 L 38 33 L 43 33 L 44 35 L 38 36 L 37 39

        </g>
        <g class="crow" data-value="5" transform="translate(126 0)">
          <path d="M14 44 C 14 38, 18 34, 22 34 L 30 30 C 33 28, 36 29, 37 31 L 38 33 L 43 33 L 44 35 L 38 36 L 37 39
                   C 34 41, 32 44, 32 48 L 34 54 L 30 54 L 28 48 L 20 49 L 19 54 L 15 54 L 17 47 C 15 46, 14 45, 14 44 Z"/>
        </g>
      </svg>
    </span>

    <span class="seal-avg"><span class="seal-avg-num">нет оценок</span></span>
  </div>
</div>
