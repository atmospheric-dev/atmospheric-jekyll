<script>
(function () {
  var URL_ = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var KEY_ = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';
  var BASE = '{{ site.baseurl }}';

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmt(iso){
    var d = new Date(iso);
    var m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return d.getDate() + ' ' + m[d.getMonth()] + ', ' + hh + ':' + mm;
  }

  async function init(){
    var tries = 0;
    while(!window.supabase && tries < 40){
      await new Promise(function(r){ setTimeout(r, 50); });
      tries++;
    }
    if(!window.supabase) return null;

    var sb = window.supabase.createClient(URL_, KEY_);
    var s = await sb.auth.getSession();
    var user = (s && s.data && s.data.session && s.data.session.user) || null;
    if(!user) return null;
    return { sb: sb, user: user };
  }

  init().then(function (ctx) {
    if (!ctx) return;
    var sb = ctx.sb, user = ctx.user;

    var wrap  = document.getElementById('bell-wrap');
    var btn   = document.getElementById('bell-btn');
    var pop   = document.getElementById('bell-pop');
    var list  = document.getElementById('bell-list');
    var count = document.getElementById('bell-count');
    var dot   = document.getElementById('topbar-dot');

    var onProfile = !!wrap;
    if (onProfile) wrap.hidden = false;

    var loaded = [];

    function render(items){
      loaded = items;
      var unread = items.filter(function(n){ return !n.is_read; }).length;

      if (onProfile && count) {
        count.textContent = unread;
        count.hidden = !unread;
      }
      if (dot) dot.hidden = !unread;

      if (!onProfile || !list) return;

      if (!items.length){
        list.innerHTML = '<div class="bell-empty">Пока тихо.</div>';
        return;
      }

      list.innerHTML = items.map(function (n) {
        var href = BASE + (n.page || '/') + '#comment-' + n.comment_id;
        return '<a class="bell-item' + (n.is_read ? '' : ' is-unread') + '"'
          + ' href="' + esc(href) + '" data-id="' + n.id + '">'
          + '<div class="bell-item-who">' + esc(n.actor_name || 'Кто-то') + ' ответил вам</div>'
          + '<div class="bell-item-body">' + esc(n.body || '') + '</div>'
          + '<div class="bell-item-where">' + esc(n.page || '') + ' · ' + fmt(n.created_at) + '</div>'
          + '</a>';
      }).join('');
    }

    function load(){
      return fetch(URL_ + '/rest/v1/notifications?select=id,comment_id,actor_name,body,page,is_read,created_at'
        + '&user_id=eq.' + user.id + '&order=created_at.desc&limit=10', {
        headers: { 'apikey': KEY_, 'Authorization': 'Bearer ' + KEY_ }
      })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(render)
      .catch(function(e){ console.warn(e); });
    }

    load();

    if (!onProfile) return;

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      pop.hidden = !pop.hidden;
      if (!pop.hidden) load();
    });

    document.addEventListener('click', function (e) {
      if (!pop.hidden && !wrap.contains(e.target)) pop.hidden = true;
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') pop.hidden = true;
    });

    list.addEventListener('click', async function (e) {
      var a = e.target.closest('.bell-item');
      if (!a) return;

      var id = a.dataset.id;
      var n = loaded.find(function(x){ return String(x.id) === String(id); });
      if (n && n.is_read) return;

      e.preventDefault();
      try {
        var sess = await sb.auth.getSession();
        var token = sess.data.session.access_token;
        await fetch(URL_ + '/rest/v1/notifications?id=eq.' + id, {
          method: 'PATCH',
          headers: {
            'apikey': KEY_,
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ is_read: true })
        });
      } catch (err) { console.warn(err); }

      var unreadLeft = loaded.filter(function(x){ return !x.is_read && String(x.id) !== String(id); }).length;
      if (count) { count.textContent = unreadLeft; count.hidden = !unreadLeft; }
      if (dot) dot.hidden = !unreadLeft;

      window.location.href = a.getAttribute('href');
    });
  });
})();
</script>
