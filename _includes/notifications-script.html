<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var URL_  = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var KEY_  = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';
  var BASE  = '{{ site.baseurl }}';

  var GOBLIN_FILES = ['archer-f','archer-m','druid-f','druid-m','bard-f','bard-m',
                      'mage-f','mage-m','knight-f','knight-m','necro-f','necro-m'];

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmt(iso){
    var d = new Date(iso);
    var m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return d.getDate() + ' ' + m[d.getMonth()] + ', ' + hh + ':' + mm;
  }

  async function init(){
    var tries = 0;
    while(!window.supabase && tries < 40){
      await new Promise(function(r){ setTimeout(r, 50); });
      tries++;
    }
    if(!window.supabase) return null;

    var sb = window.supabase.createClient(URL_, KEY_);
    var s = await sb.auth.getSession();
    var user = (s && s.data && s.data.session && s.data.session.user) || null;
    if(!user) return null;
    return { sb: sb, user: user };
  }

  init().then(function (ctx) {
    if (!ctx) return;
    var sb = ctx.sb, user = ctx.user;

    var wrap  = document.getElementById('bell-wrap');
    var btn   = document.getElementById('bell-btn');
    var pop   = document.getElementById('bell-pop');
    var list  = document.getElementById('bell-list');
    var count = document.getElementById('bell-count');
    var dot   = document.getElementById('topbar-dot');

    var onProfile = !!(wrap && btn && pop && list);
    var loaded = [];

    /* ---- колокольчик в профиле ---- */
    if (onProfile) {
      wrap.hidden = false;

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        pop.hidden = !pop.hidden;
        if (!pop.hidden) load();
      });

      document.addEventListener('click', function (e) {
        if (!pop.hidden && !wrap.contains(e.target)) pop.hidden = true;
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') pop.hidden = true;
      });

      list.addEventListener('click', async function (e) {
        var a = e.target.closest('.bell-item');
        if (!a) return;

        var id  = a.dataset.id;
        var one = null;
        for (var i = 0; i < loaded.length; i++) {
          if (String(loaded[i].id) === String(id)) one = loaded[i];
        }
        if (one && one.is_read) return;

        e.preventDefault();

        try {
          var sess  = await sb.auth.getSession();
          var token = sess.data.session.access_token;
          await fetch(URL_ + '/rest/v1/notifications?id=eq.' + id, {
            method: 'PATCH',
            headers: {
              'apikey': KEY_,
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ is_read: true })
          });
        } catch (err) { console.warn(err); }

        if (one) one.is_read = true;
        paintBadges();
        window.location.href = a.getAttribute('href');
      });
    }

    /* ---- мини-аватарка в шапке ---- */
    var tu  = document.getElementById('topbar-user');
    var tav = document.getElementById('topbar-avatar');

    if (tu && tav) {
      sb.from('profiles').select('avatar,username').eq('id', user.id).maybeSingle()
        .then(function (res) {
          var p = res && res.data;
          tav.src = BASE + '/images/goblins/' + (GOBLIN_FILES[p && p.avatar] || GOBLIN_FILES[0]) + '.jpg';
          tav.onerror = function(){ tav.src = BASE + '/logo.png'; };
          if (p && p.username) tu.title = p.username;
          tu.hidden = false;

          var prof = document.querySelector('.topbar-profile');
          if (prof) prof.hidden = true;
        })
        .catch(function(){});
    }

    /* ---- счётчики ---- */
    function paintBadges(){
      var unread = 0;
      for (var i = 0; i < loaded.length; i++) {
        if (!loaded[i].is_read) unread++;
      }

      if (onProfile && count) {
        count.textContent = unread;
        count.hidden = !unread;
      }
      if (dot) dot.hidden = !unread;
    }

    function render(items){
      loaded = items;
      paintBadges();

      if (!onProfile) return;

      if (!items.length) {
        list.innerHTML = '<div class="bell-empty">Пока тихо.</div>';
        return;
      }

      list.innerHTML = items.map(function (n) {
        var page = n.page || '/';
        var href = BASE + page + '#comment-' + n.comment_id;
        return '<a class="bell-item' + (n.is_read ? '' : ' is-unread') + '"'
          + ' href="' + esc(href) + '" data-id="' + n.id + '">'
          + '<div class="bell-item-who">' + esc(n.actor_name || 'Кто-то') + ' ответил вам</div>'
          + '<div class="bell-item-body">' + esc(n.body || '') + '</div>'
          + '<div class="bell-item-where">' + esc(page) + ' · ' + fmt(n.created_at) + '</div>'
          + '</a>';
      }).join('');
    }

    /* ---- загрузка: ВАЖНО — с токеном сессии, а не publishable ---- */
    async function load(){
      try {
        var sess  = await sb.auth.getSession();
        var token = (sess && sess.data && sess.data.session && sess.data.session.access_token) || KEY_;

        var res = await fetch(URL_ + '/rest/v1/notifications'
          + '?select=id,comment_id,actor_name,body,page,is_read,created_at'
          + '&user_id=eq.' + encodeURIComponent(user.id)
          + '&order=created_at.desc&limit=10', {
          headers: {
            'apikey': KEY_,
            'Authorization': 'Bearer ' + token
          }
        });

        if (!res.ok) {
          console.warn('notifications', res.status, await res.text());
          return;
        }

        render(await res.json());
      } catch (e) { console.warn(e); }
    }

    load();
  });
})();
</script>
