{%- assign page_key = page.url -%}
<section class="comments" data-page="{{ page_key }}">
  <h2 class="comments-title">
    Комментарии<span class="comments-count"> · <span class="comments-num">0</span></span>
  </h2>

  <form class="comment-form" novalidate>
    <input type="hidden" name="parent_id" value="">
    <div class="comment-form-row">
      <input type="text" name="name" class="comment-input" placeholder="Имя"
             maxlength="40" required autocomplete="nickname">
    </div>
    <textarea name="body" class="comment-textarea" placeholder="Что думаете?"
              maxlength="3000" rows="4" required></textarea>
    <div class="comment-form-foot">
      <span class="comment-note"></span>
      <button type="submit" class="comment-submit">Отправить</button>
    </div>
    <div class="comment-reply-to" hidden>
      Ответ на <span class="comment-reply-name"></span>
      <button type="button" class="comment-cancel-reply">отмена</button>
    </div>
  </form>

  <div class="comment-list"></div>
</section>
