<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';

  var BASE = '{{ site.baseurl }}';

  var sb = null;
  var currentUser = null;

  var REACTIONS = ['🖤','💀','🔥','💩','🤡','👎'];
  var myReactions = {};

  async function initUser() {
    var tries = 0;
    while (!window.supabase && tries < 40) {
      await new Promise(function (r) { setTimeout(r, 50); });
      tries++;
    }
    if (!window.supabase) return;
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    try {
      var s = await sb.auth.getSession();
      currentUser = (s && s.data && s.data.session && s.data.session.user) || null;
    } catch (e) { currentUser = null; }
  }

  function visitorId() {
    var k = 'atmos_visitor';
    var v = localStorage.getItem(k);
    if (!v) {
      v = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(k, v);
    }
    return v;
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', async function () {
    await initUser();

    var section = document.querySelector('.comments');
    if (!section) return;

    var page = section.dataset.page;
    var list = section.querySelector('.comment-list');
    var num = section.querySelector('.comments-num');
    var form = section.querySelector('.comment-form');
    var nameEl = form.querySelector('[name="name"]');
    var bodyEl = form.querySelector('[name="body"]');
    var parentEl = form.querySelector('[name="parent_id"]');
    var note = form.querySelector('.comment-note');
    var replyBox = form.querySelector('.comment-reply-to');
    var replyName = form.querySelector('.comment-reply-name');
    var cancelBtn = form.querySelector('.comment-cancel-reply');

    /* ---------- панель эмодзи ---------- */
    var EMOJI = [
      '🖤','💀','🦇','🐦‍⬛','🕯️','🔥','⚰️','🌫️',
      '🎸','🎧','💿','📼','🎵','🎼','🥀','🗡️',
      '🩸','⛧','☾','🌑','⚡','🕸️','🧛','👁️'
    ];

    var editor = form.querySelector('.comment-editor');
    var emojiToggle = form.querySelector('.comment-emoji-toggle');
    var emojiPanel = form.querySelector('.comment-emoji-panel');

    emojiPanel.innerHTML = EMOJI.map(function (s) {
      return '<button type="button" class="comment-emoji" data-emoji="' + s + '">' + s + '</button>';
    }).join('');

    emojiToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      emojiPanel.hidden = !emojiPanel.hidden;
    });

    emojiPanel.addEventListener('click', function (e) {
      var btn = e.target.closest('.comment-emoji');
      if (!btn) return;
      var sym = btn.dataset.emoji;
      var start = bodyEl.selectionStart;
      var end = bodyEl.selectionEnd;
      var val = bodyEl.value;
      bodyEl.value = val.slice(0, start) + sym + val.slice(end);
      var pos = start + sym.length;
      bodyEl.setSelectionRange(pos, pos);
      bodyEl.focus();
    });

    document.addEventListener('click', function (e) {
      if (emojiPanel.hidden) return;
      if (!editor.contains(e.target)) emojiPanel.hidden = true;
    });

    bodyEl.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !emojiPanel.hidden) {
        emojiPanel.hidden = true;
        bodyEl.focus();
      }
    });

    var savedName = localStorage.getItem('atmos_name');
    if (savedName) nameEl.value = savedName;

    /* ---------- залогинен: имя берём из профиля ---------- */
    if (currentUser && nameEl) {
      var row = nameEl.closest('.comment-form-row');
      var nick = currentUser.email ? currentUser.email.split('@')[0] : 'Гость';

      try {
        var prof = await sb.from('profiles').select('username').eq('id', currentUser.id).maybeSingle();
        if (prof && prof.data && prof.data.username) nick = prof.data.username;
      } catch (e) { /* остаёмся на e-mail */ }

      nameEl.value = nick;
      nameEl.removeAttribute('required');

      if (row) {
        row.innerHTML = '<span class="comment-as">Вы пишете как <a href="' + BASE + '/u.html?id='
          + encodeURIComponent(currentUser.id) + '">' + esc(nick) + '</a></span>';
      }
    }

    /* ---------- загрузка ---------- */
    async function load() {
      try {
        var url = SUPABASE_URL + '/rest/v1/comments?select=id,parent_id,name,body,created_at,user_id'
          + '&page=eq.' + encodeURIComponent(page)
          + '&order=created_at.asc';
        var res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });
        if (!res.ok) throw new Error('load: ' + res.status);
        var rows = await res.json();
        var agg = await loadReactions(rows);
        render(rows, agg);
      } catch (e) { console.warn(e); }
    }

    /* ---------- реакции ---------- */
    async function loadReactions(rows) {
      myReactions = {};
      if (!rows.length) return {};

      var ids = rows.map(function (r) { return r.id; }).join(',');
      var url = SUPABASE_URL + '/rest/v1/comment_reactions'
        + '?select=id,comment_id,user_id,emoji&comment_id=in.(' + ids + ')';

      var res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      if (!res.ok) return {};

      var data = await res.json();
      var agg = {};

      data.forEach(function (r) {
        if (!agg[r.comment_id]) agg[r.comment_id] = {};
        agg[r.comment_id][r.emoji] = agg[r.comment_id][r.emoji] || { n: 0, mine: false };
        agg[r.comment_id][r.emoji].n++;

        if (currentUser && r.user_id === currentUser.id) {
          agg[r.comment_id][r.emoji].mine = true;
          myReactions[r.comment_id + '|' + r.emoji] = r.id;
        }
      });

      return agg;
    }

    function reactionsBar(cid, agg) {
      var mine = agg[cid] || {};

      var html = '<div class="comment-reactions" data-id="' + cid + '">';
      REACTIONS.forEach(function (em) {
        var st = mine[em] || { n: 0, mine: false };
        html += '<button type="button" class="reaction' + (st.mine ? ' is-mine' : '') + (st.n ? '' : ' is-rest') + '"'
              + ' data-emoji="' + em + '"'
              + ' title="' + em + '">'
              + '<span class="reaction-em">' + em + '</span>'
              + '<span class="reaction-n">' + (st.n || '') + '</span>'
              + '</button>';
      });
      html += '<button type="button" class="reaction-add" title="Добавить реакцию">＋</button>';
      html += '</div>';

      return html;
    }

    function fmtDate(iso) {
      var d = new Date(iso);
      var months = ['января','февраля','марта','апреля','мая','июня',
                    'июля','августа','сентября','октября','ноября','декабря'];
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh + ':' + mm;
    }

    function render(rows, agg) {
      agg = agg || {};
      num.textContent = rows.length;
      if (!rows.length) {
        list.innerHTML = '<p class="comment-empty">Пока никто не высказался. Будьте первым.</p>';
        return;
      }

      var byId = {};
      rows.forEach(function (r) { byId[r.id] = r; r.children = []; });

      var roots = [];
      rows.forEach(function (r) {
        if (r.parent_id && byId[r.parent_id]) {
          byId[r.parent_id].children.push(r);
        } else {
          roots.push(r);
        }
      });

      function node(c, depth) {
        var author = c.user_id
          ? '<a class="comment-author comment-author-link" href="' + BASE + '/u.html?id='
            + encodeURIComponent(c.user_id) + '">' + esc(c.name) + '</a>'
          : '<span class="comment-author">' + esc(c.name) + '</span>';

        var html = '<div class="comment" id="comment-' + c.id + '" data-id="' + c.id + '">'
          + '<div class="comment-head">'
          +   author
          +   '<span class="comment-date">' + fmtDate(c.created_at) + '</span>'
          + '</div>'
          + '<div class="comment-text">' + esc(c.body).replace(/\n/g, '<br>') + '</div>'
          + reactionsBar(c.id, agg);

        if (depth < 1) {
          html += '<button type="button" class="comment-reply" data-id="' + c.id
                + '" data-name="' + esc(c.name) + '">Ответить</button>';
        }
        if (c.children.length) {
          html += '<div class="comment-children">';
          c.children.forEach(function (ch) { html += node(ch, depth + 1); });
          html += '</div>';
        }
        return html + '</div>';
      }

      list.innerHTML = roots.map(function (r) { return node(r, 0); }).join('');

      var hint = section.querySelector('.comment-reactions-hint');
      if (hint) hint.hidden = !!currentUser;

      /* ---------- переход к комментарию из уведомления ---------- */
      if (location.hash.indexOf('#comment-') === 0) {
        var cid = location.hash.slice(1).replace('comment-', '');

        /* помечаем уведомление прочитанным прямо здесь — надёжнее, чем при переходе */
        if (currentUser && cid) {
          (async function () {
            try {
              var sess  = await sb.auth.getSession();
              var token = (sess && sess.data && sess.data.session && sess.data.session.access_token) || SUPABASE_KEY;
              var r = await fetch(SUPABASE_URL + '/rest/v1/notifications'
                + '?comment_id=eq.' + encodeURIComponent(cid)
                + '&user_id=eq.' + encodeURIComponent(currentUser.id)
                + '&is_read=eq.false', {
                method: 'PATCH',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ is_read: true })
              });
              if (!r.ok) console.warn('notif patch', r.status, await r.text());
              else console.log('notification read for comment', cid);
            } catch (err) { console.warn(err); }
          })();
        }

        var target = document.getElementById(location.hash.slice(1));
        if (target) {
          target.classList.add('is-highlight');
          setTimeout(function () {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 120);
          setTimeout(function () {
            target.classList.remove('is-highlight');
          }, 2600);
        }
      }
    }

    load();

    /* ---------- клик по реакции ---------- */
    list.addEventListener('click', async function (e) {
      var addBtn = e.target.closest('.reaction-add');
      if (addBtn) {
        var bar0 = addBtn.closest('.comment-reactions');
        bar0.classList.toggle('is-open');
        return;
      }

      var btn = e.target.closest('.reaction');
      if (!btn) return;

      if (!currentUser) {
        var hint = section.querySelector('.comment-reactions-hint');
        if (hint) hint.hidden = false;
        return;
      }

      var bar = btn.closest('.comment-reactions');
      var cid = bar.dataset.id;
      var emoji = btn.dataset.emoji;
      var key = cid + '|' + emoji;

      btn.disabled = true;

      try {
        var sess = await sb.auth.getSession();
        var token = sess.data.session.access_token;

        if (myReactions[key]) {
          var del = await fetch(SUPABASE_URL + '/rest/v1/comment_reactions?id=eq.' + myReactions[key], {
            method: 'DELETE',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + token
            }
          });
          if (!del.ok) throw new Error('unreact');
          delete myReactions[key];
        } else {
          var ins = await fetch(SUPABASE_URL + '/rest/v1/comment_reactions', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({
              comment_id: Number(cid),
              user_id: currentUser.id,
              emoji: emoji
            })
          });
          if (!ins.ok) throw new Error('react');
          var created = await ins.json();
          myReactions[key] = created[0].id;
        }

        load();
      } catch (err) {
        console.warn(err);
      } finally {
        btn.disabled = false;
      }
    });

    /* ---------- ответ ---------- */
    list.addEventListener('click', function (e) {
      var btn = e.target.closest('.comment-reply');
      if (!btn) return;
      parentEl.value = btn.dataset.id;
      replyName.textContent = btn.dataset.name;
      replyBox.hidden = false;
      bodyEl.focus();
    });

    cancelBtn.addEventListener('click', function () {
      parentEl.value = '';
      replyBox.hidden = true;
    });

    /* ---------- отправка ---------- */
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      note.textContent = '';

      var name = nameEl ? nameEl.value.trim() : '';
      var body = bodyEl.value.trim();

      if (!currentUser && !name) { note.textContent = 'Введите имя.'; if (nameEl) nameEl.focus(); return; }
      if (body.length < 3) { note.textContent = 'Слишком короткий комментарий.'; bodyEl.focus(); return; }

      var submit = form.querySelector('.comment-submit');
      submit.disabled = true;
      note.textContent = 'Отправляем…';

      try {
        var token = SUPABASE_KEY;
        if (sb) {
          var sess = await sb.auth.getSession();
          if (sess && sess.data && sess.data.session && sess.data.session.access_token) {
            token = sess.data.session.access_token;
          }
        }

        var payload = {
          p_page: String(page),
          p_name: String(name || 'Аноним'),
          p_body: String(body),
          p_visitor: String(visitorId())
        };
        var pid = parentEl.value ? Number(parentEl.value) : 0;
        if (pid > 0) payload.p_parent = pid;

        var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/add_comment', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('add_comment: ' + res.status);
        var r = await res.json();

        if (!r.ok) {
          note.textContent = r.error === 'rate'
            ? 'Слишком часто. Подождите минуту.'
            : 'Не получилось отправить.';
          return;
        }

        if (!currentUser) localStorage.setItem('atmos_name', name);
        bodyEl.value = '';
        parentEl.value = '';
        replyBox.hidden = true;

        if (r.approved) {
          note.textContent = 'Отправлено.';
          load();
        } else {
          note.textContent = 'Отправлено. Комментарий появится после проверки.';
        }
      } catch (err) {
        console.warn(err);
        note.textContent = 'Ошибка отправки.';
      } finally {
        submit.disabled = false;
      }
    });
  });
})();
</script>
