<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0d0c0b">

<link rel="icon" type="image/png" sizes="512x512" href="{{ site.baseurl }}/favicon-simple.png?v=3">
<link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/favicon-simple.png?v=3">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/favicon-simple.png?v=3">

<link rel="stylesheet" href="{{ site.baseurl }}/style.css">
