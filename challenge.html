---
layout: default
title: Челлендж
permalink: /challenge/
description: "31 день — 31 тёмный альбом. Один альбом в день, тема от нас, выбор от тебя."
---

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/challenge.css">

<div class="ch-wrap">

  <header class="ch-head">
    <p class="ch-kicker">Атмосферный челлендж</p>
    <h1 class="ch-title" id="chTitle">Декабрь: 31 день — 31 тёмный альбом</h1>
    <p class="ch-desc" id="chDesc"></p>
    <div class="ch-stats">
      <span><b id="chDone">0</b> / <span id="chTotal">31</span></span>
      <span id="chLeft"></span>
    </div>
    <div class="ch-bar"><div class="ch-bar-fill" id="chBar"></div></div>
  </header>

  <div class="ch-legend">
    <span class="ch-key ch-key-done">заполнено</span>
    <span class="ch-key ch-key-open">сегодня</span>
    <span class="ch-key ch-key-miss">пропуск</span>
    <span class="ch-key ch-key-shut">закрыт</span>
  </div>

  <div class="ch-cal" id="chCal"></div>

  <div class="ch-makeup">
    <button class="ch-btn" id="chMakeupBtn" type="button" disabled>
      Восполнить пропуски <span id="chLeftCount"></span>
    </button>
    <p class="ch-note" id="chMakeupNote"></p>
  </div>

  <div class="ch-makeup-box" id="chMakeupBox" hidden></div>

  <div class="ch-msg" id="chMsg" hidden></div>
</div>

<div class="ch-modal" id="chModal" hidden>
  <div class="ch-modal-box" role="dialog" aria-modal="true">
    <button class="ch-modal-x" id="chModalClose" type="button" aria-label="Закрыть">×</button>
    <p class="ch-modal-day" id="chModalDay"></p>
    <p class="ch-modal-prompt" id="chModalPrompt"></p>
    <form id="chForm" autocomplete="off">
      <label class="ch-label">Группа
        <input class="ch-input" id="chArtist" type="text" maxlength="120" required>
      </label>
      <label class="ch-label">Альбом
        <input class="ch-input" id="chAlbum" type="text" maxlength="160" required>
      </label>
      <button class="ch-btn" type="submit" id="chSubmit">Отметить</button>
    </form>
    <div class="ch-others" id="chOthers"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var URL_  = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var KEY_  = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';
  var CHALLENGE_SLUG = '2026-12';

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var todayISO = function () { return iso(new Date()); };

  var user = null, token = KEY_;
  var CHALLENGE_ID = '';
  var prompts = [], entries = {}, startISO = '';
  var makeupUsed = 0, selected = null, busy = false, makeupDay = null;

  var msgEl = $('chMsg');
  function msg(text, kind) {
    if (!msgEl) return;
    msgEl.hidden = false;
    msgEl.textContent = text;
    msgEl.className = 'ch-msg ch-msg-' + (kind || 'info');
  }

  function weekStart(d) {
    var x = new Date(d || new Date());
    var shift = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - shift);
    return iso(x);
  }

  function dayDate(day) {
    var s = new Date(startISO + 'T00:00:00');
    s.setDate(s.getDate() + day - 1);
    return iso(s);
  }

  function rest(path, opts) {
    opts = opts || {};
    var headers = {
      'apikey': KEY_,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };
    if (opts.headers) { for (var k in opts.headers) headers[k] = opts.headers[k]; }
    return fetch(URL_ + '/rest/v1/' + path, {
      method: opts.method || 'GET', headers: headers, body: opts.body
    }).then(function (res) {
      return res.text().then(function (txt) {
        if (!res.ok) throw new Error(txt || ('HTTP ' + res.status));
        return txt ? JSON.parse(txt) : null;
      });
    });
  }

  function getClient() {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
    if (window.__atm) return window.__atm;
    window.__atm = window.supabase.createClient(URL_, KEY_);
    return window.__atm;
  }

  function waitClient() {
    return new Promise(function (resolve) {
      var tries = 0;
      (function loop() {
        var c = getClient();
        if (c || tries > 60) return resolve(c);
        tries++;
        setTimeout(loop, 50);
      })();
    });
  }

  /* ---------- visitor: тот же ключ, что у оценок и дневника ---------- */

  function visitorId() {
    var k = 'atmos_visitor';
    var v = localStorage.getItem(k);
    if (!v) {
      v = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      localStorage.setItem(k, v);
    }
    return v;
  }

  function weekRange() {
    var ws = weekStart();
    var from = new Date(ws + 'T00:00:00');
    var to = new Date(from.getTime() + 7 * 864e5);
    return { from: from.toISOString(), to: to.toISOString(), ws: ws };
  }

  async function tasksDone() {
    var v = visitorId();
    var r = weekRange();

    function check(table, dateCol, extra) {
      var q = table + '?select=id&visitor=eq.' + encodeURIComponent(v)
        + '&' + dateCol + '=gte.' + r.from
        + '&' + dateCol + '=lt.' + r.to + (extra || '');
      return rest(q).then(function (rows) { return (rows || []).length; })
                    .catch(function () { return 0; });
    }

    return {
      rating:  await check('ratings',   'created_at'),
      diary:   await check('album_log', 'logged_at', '&mark=eq.done'),
      comment: await check('comments',  'created_at')
    };
  }

  /* ---------- загрузка ---------- */

  async function init() {
    try {
      var sb = await waitClient();
      if (!sb) { msg('Supabase не загрузился на странице.', 'err'); return; }

      try {
        var s = await sb.auth.getSession();
        var sess = s && s.data && s.data.session;
        if (sess) { user = sess.user; token = sess.access_token; }
      } catch (e) { console.warn('session', e); }

      try {
        var chs = await rest('challenges?select=*&slug=eq.' + CHALLENGE_SLUG);
        var ch = chs && chs[0];
        if (!ch) { msg('Челлендж ' + CHALLENGE_SLUG + ' не найден в базе.', 'err'); return; }
        CHALLENGE_ID = ch.id;
        startISO = ch.starts_on;
        $('chTitle').textContent = ch.title || 'Челлендж';
        $('chDesc').textContent = ch.description || '';
      } catch (e) {
        msg('Не удалось прочитать челлендж: ' + e.message, 'err');
        return;
      }

      try {
        prompts = await rest('prompts?select=id,day,text,note&challenge_id=eq.'
          + CHALLENGE_ID + '&order=day');
        prompts = prompts || [];
        $('chTotal').textContent = prompts.length;
      } catch (e) {
        msg('Не удалось прочитать темы: ' + e.message, 'err');
        return;
      }

      if (!prompts.length) {
        msg('Темы для челленджа не найдены — проверьте таблицу prompts.', 'err');
        return;
      }

      if (user) {
        try { await loadEntries(); } catch (e) { console.warn('entries', e); }
        try { await loadMakeups(); } catch (e) { console.warn('makeups', e); }
      }

      render();

      if (!user) {
        $('chMakeupNote').textContent = 'Войдите в профиль, чтобы отмечать альбомы.';
      }
    } catch (e) {
      msg('Ошибка загрузки: ' + e.message, 'err');
      console.error(e);
    }
  }

  async function loadEntries() {
    var rows = await rest('entries?select=prompt_id,artist,album,is_makeup&challenge_id=eq.'
      + CHALLENGE_ID + '&user_id=eq.' + user.id);
    entries = {};
    (rows || []).forEach(function (e) { entries[e.prompt_id] = e; });
  }

  async function loadMakeups() {
    var rows = await rest('makeups?select=id&challenge_id=eq.' + CHALLENGE_ID
      + '&user_id=eq.' + user.id + '&week_start=eq.' + weekStart());
    makeupUsed = (rows || []).length;
  }

  /* ---------- календарь ---------- */

  function render() {
    var cal = $('chCal');
    cal.innerHTML = '';
    var today = todayISO();
    var done = 0, missed = 0;

    prompts.forEach(function (p) {
      var d = dayDate(p.day);
      var filled = !!entries[p.id];
      if (filled) done++;

      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'ch-cell';

      var num = document.createElement('span');
      num.className = 'ch-cell-num';
      num.textContent = p.day;
      cell.appendChild(num);

      var txt = document.createElement('span');
      txt.className = 'ch-cell-txt';
      txt.textContent = filled ? entries[p.id].album
                               : (d <= today ? p.text : '· · ·');
      cell.appendChild(txt);

      if (filled) {
        cell.classList.add('is-done');
      } else if (d > today) {
        cell.classList.add('is-shut');
        cell.disabled = true;
      } else if (d === today) {
        cell.classList.add('is-open');
      } else {
        cell.classList.add('is-miss');
        missed++;
        cell.disabled = true;
      }

      if (!cell.disabled) cell.addEventListener('click', function () { openDay(p); });
      cal.appendChild(cell);
    });

    var total = prompts.length || 1;
    $('chDone').textContent = done;
    $('chBar').style.width = Math.round((done / total) * 100) + '%';
    $('chLeft').textContent = missed ? 'пропущено ' + missed : 'пропусков нет';

    var left = Math.max(0, 3 - makeupUsed);
    $('chLeftCount').textContent = left ? '(' + left + ' на эту неделю)' : '(лимит исчерпан)';
    $('chMakeupBtn').disabled = !user || !left || !missed;
    $('chMakeupNote').textContent = missed
      ? 'Восполнение закрывает один пропущенный день. Задание нужно выполнить по-настоящему.'
      : '';
  }

  /* ---------- форма дня ---------- */

  function openDay(p) {
    selected = p;
    selected.__makeup = false;
    selected.__task = null;
    $('chModalDay').textContent = 'День ' + p.day;
    $('chModalPrompt').textContent = p.text;
    var e = entries[p.id];
    $('chArtist').value = e ? e.artist : '';
    $('chAlbum').value = e ? e.album : '';
    $('chSubmit').textContent = e ? 'Сохранить' : 'Отметить';
    $('chOthers').innerHTML = '';
    loadOthers(p);
    $('chModal').hidden = false;
    setTimeout(function () { $('chArtist').focus(); }, 50);
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  async function loadOthers(p) {
    try {
      var rows = await rest('entries?select=artist,album&prompt_id=eq.' + p.id + '&limit=60');
      if (!rows || !rows.length) {
        $('chOthers').innerHTML = '<p class="ch-others-empty">Пока никто не ответил.</p>';
        return;
      }
      var counts = {};
      rows.forEach(function (r) {
        var k = (r.artist || '') + ' — ' + (r.album || '');
        counts[k] = (counts[k] || 0) + 1;
      });
      var list = Object.keys(counts)
        .sort(function (a, b) { return counts[b] - counts[a]; })
        .slice(0, 10)
        .map(function (k) {
          return '<li><span>' + esc(k) + '</span><b>' + counts[k] + '</b></li>';
        })
        .join('');
      $('chOthers').innerHTML = '<p class="ch-others-head">Что вписывают</p><ul>' + list + '</ul>';
    } catch (e) {
      $('chOthers').innerHTML = '<p class="ch-others-empty">Не удалось загрузить ответы.</p>';
    }
  }

  function closeModal() { $('chModal').hidden = true; }

  $('chModalClose').addEventListener('click', closeModal);
  $('chModal').addEventListener('click', function (ev) {
    if (ev.target === $('chModal')) closeModal();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeModal();
  });

  /* ---------- сохранение записи (обычной и восполнения) ---------- */

  $('chForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    if (!user) { msg('Войдите в профиль, чтобы отмечать альбомы.', 'err'); return; }

    var artist = $('chArtist').value.trim();
    var album = $('chAlbum').value.trim();
    if (!artist || !album || !selected) return;

    var isMakeup = !!selected.__makeup;
    var task = selected.__task;
    var dayIdx = selected.day;

    busy = true;
    $('chSubmit').disabled = true;

    rest('entries?on_conflict=user_id,prompt_id', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify({
        prompt_id: selected.id,
        challenge_id: CHALLENGE_ID,
        user_id: user.id,
        artist: artist,
        album: album,
        is_makeup: isMakeup
      })
    }).then(function (rows) {
      var saved = rows && rows[0];
      if (!isMakeup) return null;
      if (!saved || !saved.id) throw new Error('запись не вернула id');

      /* восполнение привязывается к уже сохранённой записи */
      return rest('makeups', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          challenge_id: CHALLENGE_ID,
          user_id: user.id,
          entry_id: saved.id,
          week_start: weekRange().ws,
          task: task
        })
      });
    }).then(function () {
      return loadMakeups();
    }).then(function () {
      return loadEntries();
    }).then(function () {
      closeModal();
      render();
      msg((isMakeup ? 'Восполнение записано, день ' + dayIdx + ': ' : 'Записано: ')
          + artist + ' — ' + album, 'info');
      selected = null;
    }).catch(function (e) {
      msg('Не сохранилось: ' + e.message, 'err');
    }).then(function () {
      busy = false;
      $('chSubmit').disabled = false;
    });
  });

  /* ---------- восполнения ---------- */

  function taskRow(title, hint, count) {
    return '<li class="ch-task' + (count ? ' is-done' : '') + '">'
      + '<div class="ch-task-txt"><b>' + title + '</b><span>' + hint + '</span></div>'
      + (count ? '<span class="ch-task-ok">выполнено</span>'
               : '<a class="ch-task-go" href="' + String.fromCharCode(47) + 'releases.html">Перейти</a>')
      + '</li>';
  }

  $('chMakeupBtn').addEventListener('click', async function () {
    var boxEl = $('chMakeupBox');
    if (!boxEl.hidden) { boxEl.hidden = true; return; }

    var missed = prompts.filter(function (p) {
      return !entries[p.id] && dayDate(p.day) < todayISO();
    });
    if (!missed.length) { msg('Пропусков нет.', 'info'); return; }

    makeupDay = missed[0];
    var t = await tasksDone();
    var left = Math.max(0, 3 - makeupUsed);

    boxEl.innerHTML =
      '<p class="ch-makeup-head">Пропущен день ' + makeupDay.day + ' — «'
      + esc(makeupDay.text) + '»</p>'
      + '<p class="ch-makeup-hint">Выполните любое действие на этой неделе и нажмите «Проверить». '
      + 'Осталось восполнений: ' + left + ' из 3.</p>'
      + '<ul class="ch-makeup-tasks">'
      + taskRow('Оценить альбом',       'поставьте оценку на странице любой рецензии', t.rating)
      + taskRow('Отметить «Послушал»',  'нажмите «Послушал» на странице альбома',       t.diary)
      + taskRow('Оставить комментарий', 'напишите комментарий под любой рецензией',     t.comment)
      + '</ul>'
      + '<button class="ch-btn" type="button" id="chCheckTasks">Проверить</button>';

    boxEl.hidden = false;
    $('chCheckTasks').addEventListener('click', checkTasks);
  });

  async function checkTasks() {
    var t = await tasksDone();
    var task = t.rating ? 'rating' : t.diary ? 'diary' : t.comment ? 'comment' : null;

    if (!task) {
      msg('На этой неделе нет выполненных действий. Оцените альбом, отметьте «Послушал» или оставьте комментарий.', 'err');
      return;
    }

    makeupDay.__makeup = true;
    makeupDay.__task = task;
    selected = makeupDay;

    $('chMakeupBox').hidden = true;
    $('chModalDay').textContent = 'День ' + makeupDay.day + ' · восполнение';
    $('chModalPrompt').textContent = makeupDay.text;
    $('chArtist').value = '';
    $('chAlbum').value = '';
    $('chSubmit').textContent = 'Записать';
    $('chOthers').innerHTML = '';
    loadOthers(makeupDay);
    $('chModal').hidden = false;
    setTimeout(function () { $('chArtist').focus(); }, 50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
