---
layout: default
title: Ретроспектива
---

<div class="wrap">
  <h1 class="page-title">Ретроспектива</h1>
  <p class="page-lead">Вся дискография одного проекта — в одной статье.</p>

  <div class="retro-grid">
    {% for r in site.retrospectives %}
      <a class="retro-card" href="{{ r.url | relative_url }}" data-tags="{{ r.tags | join: ' ' | slugify }}">
        <div class="retro-card-strip">
          {% if r.cover %}
            <img src="{{ r.cover | relative_url }}" alt="{{ r.artist }}">
          {% endif %}
        </div>
        <div class="retro-card-inner">
          <p class="retro-card-title">{{ r.title }}</p>
          <p class="retro-card-artist">{{ r.artist }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
</div>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var tag = params.get("tag");
    if (!tag) return;
    var cards = document.querySelectorAll(".retro-card");
    var shown = 0;
    cards.forEach(function (card) {
      var tags = (card.getAttribute("data-tags") || "").split(" ");
      if (tags.indexOf(tag) === -1) {
        card.style.display = "none";
      } else {
        shown++;
      }
    });
    if (shown === 0) {
      cards.forEach(function (card) { card.style.display = ""; });
    }
  }());
</script>
