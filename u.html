---
layout: default
title: Профиль
permalink: /u.html
---

<div class="profile-wrap">

  <p class="profile-note" id="u-loading">Загружаем профиль…</p>

  <div id="u-box" hidden>

    <div class="u-hero-top" id="u-actions" hidden>
      <a class="u-action" id="u-act-diary" href="{{ site.baseurl }}/diary.html">Дневник</a>
      <a class="u-action u-action--edit" id="u-act-edit" href="{{ site.baseurl }}/profile-edit.html">Редактировать</a>
    </div>

    <div class="u-hero" id="u-hero">
      <div class="u-medals" id="u-medals"></div>
      <div class="u-hero-inner">
        <img class="profile-avatar u-avatar" id="u-avatar" src="" alt="">

        <div class="profile-id">
          <div class="profile-username u-username" id="u-username">—</div>
          <div class="profile-status" id="u-status"></div>
          <div class="profile-since" id="u-since"></div>
        </div>
      </div>

      <div class="bell-wrap" id="bell-wrap" hidden>
        <button type="button" class="bell-btn" id="bell-btn" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
          <span class="bell-count" id="bell-count" hidden>0</span>
        </button>
        <div class="bell-pop" id="bell-pop" hidden>
          <div class="bell-head">Уведомления</div>
          <div class="bell-list" id="bell-list"></div>
        </div>
      </div>
    </div>

    <div class="u-meta" id="u-meta"></div>

    <h2 class="profile-sub">О себе</h2>
    <p class="profile-fav u-about" id="u-about">—</p>

    <h2 class="profile-sub">Любимые альбомы</h2>
    <div class="u-albums" id="u-albums"></div>

    <h2 class="profile-sub">Коллекция</h2>
    <div class="u-collection" id="u-collection"></div>

    <div class="u-badges" id="u-badges"></div>

  </div>

  <p class="profile-note" id="u-error" hidden>Такого профиля нет.</p>
</div>

<!-- ===== ПРОСМОТР ФОТО ===== -->
<div class="u-viewer" id="u-viewer" hidden>
  <button type="button" class="u-viewer-close" id="u-viewer-close" aria-label="Закрыть">×</button>
  <button type="button" class="u-viewer-nav u-viewer-prev" id="u-viewer-prev" aria-label="Предыдущее">‹</button>
  <img class="u-viewer-img" id="u-viewer-img" src="" alt="">
  <button type="button" class="u-viewer-nav u-viewer-next" id="u-viewer-next" aria-label="Следующее">›</button>
  <div class="u-viewer-count" id="u-viewer-count"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';

  var GOBLIN_FILES = ['archer-f','archer-m','druid-f','druid-m','bard-f','bard-m',
                      'mage-f','mage-m','knight-f','knight-m','necro-f','necro-m'];

  var KIND_NAMES = {
    music: 'Музыка',
    book:  'Книга',
    zine:  'Журнал',
    film:  'Фильм',
    other: 'Другое'
  };

  var KIND_ORDER = ['music','book','zine','film','other'];

  var loading = document.getElementById('u-loading');
  var box     = document.getElementById('u-box');
  var err     = document.getElementById('u-error');
  var base    = '{{ site.baseurl }}';

  function fail(){
    loading.hidden = true;
    box.hidden = true;
    err.hidden = false;
  }

  var params = new URLSearchParams(location.search);
  var uid    = params.get('id');
  var name   = params.get('name');

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ================= ПРОСМОТР ФОТО ================= */

  var viewer = {
    root:  document.getElementById('u-viewer'),
    img:   document.getElementById('u-viewer-img'),
    close: document.getElementById('u-viewer-close'),
    prev:  document.getElementById('u-viewer-prev'),
    next:  document.getElementById('u-viewer-next'),
    count: document.getElementById('u-viewer-count'),
    list:  [],
    idx:   0
  };

  function viewerPaint(){
    if(!viewer.list.length) return;
    viewer.img.src = viewer.list[viewer.idx];
    viewer.count.textContent = viewer.list.length > 1
      ? (viewer.idx + 1) + ' / ' + viewer.list.length
      : '';

    var many = viewer.list.length > 1;
    viewer.prev.hidden = !many;
    viewer.next.hidden = !many;
  }

  function viewerStep(delta){
    if(viewer.list.length < 2) return;
    viewer.idx = (viewer.idx + delta + viewer.list.length) % viewer.list.length;
    viewerPaint();
  }

  function openViewer(photos, start){
    if(!photos || !photos.length) return;

    viewer.list = photos.slice();
    viewer.idx  = start || 0;

    viewer.root.hidden = false;
    document.body.classList.add('modal-open');
    viewerPaint();
  }

  function closeViewer(){
    viewer.root.hidden = true;
    document.body.classList.remove('modal-open');
    viewer.img.removeAttribute('src');
  }

  viewer.close.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    closeViewer();
  });

  viewer.prev.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    viewerStep(-1);
  });

  viewer.next.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    viewerStep(1);
  });

  viewer.root.addEventListener('click', function(e){
    if(e.target === viewer.root) closeViewer();
  });

  document.addEventListener('keydown', function(e){
    if(viewer.root.hidden) return;
    if(e.key === 'Escape') closeViewer();
    if(e.key === 'ArrowLeft'){
      e.preventDefault();
      viewerStep(-1);
    }
    if(e.key === 'ArrowRight'){
      e.preventDefault();
      viewerStep(1);
    }
  });

  /* ================= ПРОФИЛЬ ================= */

  var myId = null;

  function isMine(id){
    return !!myId && !!id && String(myId) === String(id);
  }

  function showActions(id){
    var acts = document.getElementById('u-actions');
    if(!acts) return;

    if(!isMine(id)){
      acts.hidden = true;
      return;
    }
    acts.hidden = false;
  }

  function start(){
    if(!uid && !name){
      sb.auth.getSession().then(function(s){
        if(s.data && s.data.session && s.data.session.user){
          location.replace(base + '/u.html?id=' + s.data.session.user.id);
        } else {
          fail();
        }
      }).catch(fail);
      return;
    }

    var q = sb
      .from('profiles')
      .select('id,username,status,about,city,cover_url,fav_albums,gender,birthdate,avatar,created_at');

    q = uid ? q.eq('id', uid) : q.ilike('username', name);

    q.maybeSingle()
      .then(function(res){
        if(res.error || !res.data){ fail(); return; }
        var p = res.data;
        render(p);
        showActions(p.id);
        loadCollection(p.id);
        loadMedals(p.id);
      })
      .catch(function(){ fail(); });
  }

  sb.auth.getSession().then(function(s){
    if(s.data && s.data.session && s.data.session.user){
      myId = s.data.session.user.id;
    }
    start();
  }).catch(function(){
    start();
  });

  /* ---- отрисовка профиля ---- */
  function render(p){
    loading.hidden = true;
    box.hidden = false;

    document.title = (p.username || 'Профиль') + ' — Atmospheric';

    var hero = document.getElementById('u-hero');
    if(p.cover_url){
      hero.style.backgroundImage = 'url("' + p.cover_url + '")';
      hero.classList.add('has-cover');
    }

    var av = document.getElementById('u-avatar');
    av.src = base + '/images/goblins/' + (GOBLIN_FILES[p.avatar] || GOBLIN_FILES[0]) + '.jpg';
    av.onerror = function(){ av.src = base + '/logo.png'; };

    document.getElementById('u-username').textContent = p.username || 'Без имени';
    document.getElementById('u-status').textContent   = p.status || '';

    var since = p.created_at ? new Date(p.created_at).toLocaleDateString('ru-RU') : '';
    document.getElementById('u-since').textContent = since ? 'На сайте с ' + since : '';

    var meta = [];
    if(p.city) meta.push(p.city);
    if(p.gender === 'male')   meta.push('Мужской');
    if(p.gender === 'female') meta.push('Женский');
    if(p.birthdate){
      var b = new Date(p.birthdate);
      var now = new Date();
      var age = now.getFullYear() - b.getFullYear();
      var m = now.getMonth() - b.getMonth();
      if(m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
      if(age > 0 && age < 120) meta.push(age + ' ' + ageWord(age));
    }
    document.getElementById('u-meta').textContent = meta.join(' · ');

    var about = document.getElementById('u-about');
    if(p.about){
      about.textContent = p.about;
    } else {
      about.textContent = 'Не рассказал о себе.';
      about.classList.add('is-empty');
    }

    var wrap = document.getElementById('u-albums');
    wrap.innerHTML = '';
    var list = Array.isArray(p.fav_albums) ? p.fav_albums.slice(0, 3) : [];

    if(!list.length){
      wrap.innerHTML = '<p class="profile-fav is-empty">Не указаны.</p>';
    } else {
      list.forEach(function(a){
        var card = document.createElement('div');
        card.className = 'u-album';

        var img = document.createElement('img');
        img.className = 'u-album-cover';
        img.alt = '';
        if(a.cover){
          img.src = a.cover;
          img.onerror = function(){ img.classList.add('is-missing'); };
        } else {
          img.classList.add('is-missing');
        }

        var cap = document.createElement('div');
        cap.className = 'u-album-cap';

        var artist = document.createElement('div');
        artist.className = 'u-album-artist';
        artist.textContent = a.artist || '';

        var album = document.createElement('div');
        album.className = 'u-album-name';
        album.textContent = a.album || '';

        var shade = document.createElement('div');
        shade.className = 'u-album-shade';

        cap.appendChild(shade);
        cap.appendChild(artist);
        cap.appendChild(album);

        card.appendChild(img);
        card.appendChild(cap);
        wrap.appendChild(card);
      });

      requestAnimationFrame(function(){
        var caps = wrap.querySelectorAll('.u-album-artist, .u-album-name');
        for(var k = 0; k < caps.length; k++) fitText(caps[k]);
      });

      window.addEventListener('resize', function(){
        var caps = wrap.querySelectorAll('.u-album-artist, .u-album-name');
        for(var k = 0; k < caps.length; k++) fitText(caps[k]);
      });
    }
  }

  function fitText(el){
    if(!el.dataset.max){
      el.dataset.max = parseFloat(getComputedStyle(el).fontSize);
    }
    var max = parseFloat(el.dataset.max);
    var min = Math.max(7, max * 0.6);
    var size = max;
    var guard = 0;

    el.style.fontSize = max + 'px';

    while(el.scrollWidth > el.clientWidth + 1 && size > min && guard < 80){
      size -= 0.5;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }

  /* ================= КОЛЛЕКЦИЯ ================= */

  function loadCollection(id){
    var wrap = document.getElementById('u-collection');
    if(!wrap) return;

    wrap.innerHTML = '<p class="profile-fav is-empty">Загружаем…</p>';

    sb.from('collection')
      .select('id,kind,artist,title,format,year,comment,photos,created_at')
      .eq('user_id', id)
      .order('created_at', { ascending: false })
      .then(function(res){
        if(res.error){ showCollectionEmpty(wrap, res.error.message); return; }
        renderCollection(wrap, res.data || []);
      })
      .catch(function(){ showCollectionEmpty(wrap); });
  }

  function showCollectionEmpty(wrap, msg){
    wrap.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'profile-fav is-empty';
    p.textContent = 'Пока пусто.';
    wrap.appendChild(p);
    if(msg && window.console) console.warn('collection:', msg);
  }

  function renderCollection(wrap, rows){
    wrap.innerHTML = '';

    if(!rows.length){
      showCollectionEmpty(wrap);
      return;
    }

    var counts = {};
    rows.forEach(function(r){
      var k = KIND_NAMES[r.kind] ? r.kind : 'other';
      counts[k] = (counts[k] || 0) + 1;
    });

    var stat = document.createElement('div');
    stat.className = 'u-col-stat';
    KIND_ORDER.forEach(function(k){
      if(!counts[k]) return;
      var s = document.createElement('span');
      s.className = 'u-col-stat-item';
      s.textContent = KIND_NAMES[k] + ' — ' + counts[k];
      stat.appendChild(s);
    });
    wrap.appendChild(stat);

    var grid = document.createElement('div');
    grid.className = 'u-col-grid';

    rows.forEach(function(r){
      var card = document.createElement('div');
      card.className = 'u-col-card';

      var photos = Array.isArray(r.photos) ? r.photos.filter(Boolean) : [];

      var media = document.createElement('div');
      media.className = 'u-col-media';

      if(photos.length){
        var img = document.createElement('img');
        img.className = 'u-col-img';
        img.src = photos[0];
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function(){
          img.classList.add('is-missing');
          img.removeAttribute('src');
        };
        media.appendChild(img);

        if(photos.length > 1){
          var more = document.createElement('span');
          more.className = 'u-col-more';
          more.textContent = '+' + (photos.length - 1);
          media.appendChild(more);
        }

        media.classList.add('is-clickable');
        media.addEventListener('click', function(){ openViewer(photos, 0); });

        if(photos.length > 1){
          var strip = document.createElement('div');
          strip.className = 'u-col-strip';

          photos.slice(0, 6).forEach(function(u, n){
            var t = document.createElement('img');
            t.className = 'u-col-thumb';
            t.src = u;
            t.alt = '';
            t.loading = 'lazy';
            t.addEventListener('click', function(e){
              e.stopPropagation();
              openViewer(photos, n);
            });
            strip.appendChild(t);
          });

          media.appendChild(strip);
        }
      } else {
        media.classList.add('u-col-media--empty');
      }

      card.appendChild(media);

      var body = document.createElement('div');
      body.className = 'u-col-body';

      var k = document.createElement('div');
      k.className = 'u-col-kind';
      k.textContent = KIND_NAMES[r.kind] || 'Другое';

      var t = document.createElement('div');
      t.className = 'u-col-title';
      t.textContent = r.title || '';

      body.appendChild(k);
      body.appendChild(t);

      var sub = [r.artist, r.format, r.year].filter(Boolean).join(' · ');
      if(sub){
        var s = document.createElement('div');
        s.className = 'u-col-sub';
        s.textContent = sub;
        body.appendChild(s);
      }

      if(r.comment){
        var c = document.createElement('div');
        c.className = 'u-col-text';
        c.textContent = r.comment;
        body.appendChild(c);
      }

      card.appendChild(body);
      grid.appendChild(card);
    });

    wrap.appendChild(grid);
  }

    /* ================= ЧЕЛЛЕНДЖ ================= */

  var CH_SLUG = '2026-12';

  function loadChallenge(id){
    var wrap = document.getElementById('u-challenge');
    if(!wrap) return;

    sb.from('challenges')
      .select('id,title,starts_on')
      .eq('slug', CH_SLUG)
      .maybeSingle()
      .then(function(res){
        var ch = res && res.data;
        if(!ch) return null;

        return sb.from('entries')
          .select('prompt_id,is_makeup')
          .eq('challenge_id', ch.id)
          .eq('user_id', id)
          .then(function(er){
            var rows = (er && er.data) || [];
            return sb.from('prompts')
              .select('id')
              .eq('challenge_id', ch.id)
              .then(function(pr){
                var total = ((pr && pr.data) || []).length;
                var done  = rows.length;
                var mk    = rows.filter(function(r){ return r.is_makeup; }).length;

                document.getElementById('u-challenge-name').textContent =
                  ch.title || 'Челлендж';
                document.getElementById('u-challenge-done').textContent = done;
                document.getElementById('u-challenge-total').textContent = total;
                document.getElementById('u-challenge-fill').style.width =
                  Math.round((done / (total || 1)) * 100) + '%';
                document.getElementById('u-challenge-makeup').textContent =
                  mk ? 'восполнений ' + mk : 'без восполнений';

                wrap.hidden = false;
              });
          });
      })
      .catch(function(){ /* молча */ });
  }
  
  /* ================= ЗНАЧКИ ================= */

  var MEDALS = {
    comment: { dir: 'comment', name: 'Комментарии' },
    marks:   { dir: 'marks',   name: 'Отметки альбомов' },
    diary:   { dir: 'diary',   name: 'Дневник' },
    collect: { dir: 'collect', name: 'Коллекция' },
    loyal:   { dir: 'loyal',   name: 'Лояльность' }
  };

  var ROMAN = ['', 'I', 'II', 'III'];

  function loadMedals(id){
    var wrap = document.getElementById('u-medals');
    if(!wrap) return;
    wrap.innerHTML = '';

    sb.from('user_levels')
      .select('category,level')
      .eq('user_id', id)
      .then(function(res){
        if(res.error || !res.data || !res.data.length) return;

        var order = ['comment', 'marks', 'diary', 'collect', 'loyal'];

        order.forEach(function(cat){
          var row = null;
          for(var i = 0; i < res.data.length; i++){
            if(res.data[i].category === cat) row = res.data[i];
          }
          if(!row || !row.level) return;

          var m = MEDALS[cat];
          if(!m) return;

          var img = document.createElement('img');
          img.className = 'u-medal';
          img.src = base + '/images/badges/' + m.dir + '-' + row.level + '.svg';
          img.alt = m.name;
          img.title = m.name + ' — уровень ' + ROMAN[row.level] + ' из III';
          img.loading = 'lazy';
          img.onerror = function(){ this.remove(); };

          wrap.appendChild(img);
        });
      })
      .catch(function(){ /* молча */ });
  }

  function ageWord(n){
    var t = n % 10, h = n % 100;
    if(h >= 11 && h <= 14) return 'лет';
    if(t === 1) return 'год';
    if(t >= 2 && t <= 4) return 'года';
    return 'лет';
  }
})();
</script>
