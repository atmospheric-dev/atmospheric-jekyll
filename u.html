      <div class="u-actions" id="u-actions" hidden>
        <a class="u-action" id="u-act-my" href="{{ site.baseurl }}/my.html">Слушаю</a>
        <a class="u-action" id="u-act-diary" href="{{ site.baseurl }}/diary.html">Дневник</a>
        <a class="u-action u-action--edit" id="u-act-edit" href="{{ site.baseurl }}/profile.html">Редактировать</a>
      </div>

      <div class="u-hero-inner">
        <img class="profile-avatar u-avatar" id="u-avatar" src="" alt="">

        <div class="profile-id">

          <div class="profile-since" id="u-since"></div>
        </div>
      </div>
    </div>

<!-- ===== ПРОСМОТР ФОТО ===== -->
<div class="u-viewer" id="u-viewer" hidden>
  <button type="button" class="u-viewer-close" id="u-viewer-close" aria-label="Закрыть">×</button>
  <button type="button" class="u-viewer-nav u-viewer-prev" id="u-viewer-prev" aria-label="Предыдущее">‹</button>
  <img class="u-viewer-img" id="u-viewer-img" src="" alt="">
  <button type="button" class="u-viewer-nav u-viewer-next" id="u-viewer-next" aria-label="Следующее">›</button>
  <div class="u-viewer-count" id="u-viewer-count"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';

  var GOBLIN_FILES = ['archer-f','archer-m','druid-f','druid-m','bard-f','bard-m',
                      'mage-f','mage-m','knight-f','knight-m','necro-f','necro-m'];

  var KIND_NAMES = {
    music: 'Музыка',
    book:  'Книга',
    zine:  'Журнал',
    film:  'Фильм',
    other: 'Другое'
  };

  var KIND_ORDER = ['music','book','zine','film','other'];

  var loading = document.getElementById('u-loading');
  var box     = document.getElementById('u-box');
  var err     = document.getElementById('u-error');
  var base    = '{{ site.baseurl }}';

  function fail(){
    loading.hidden = true;
    box.hidden = true;
    err.hidden = false;
  }

  var params = new URLSearchParams(location.search);
  var uid    = params.get('id');
  var name   = params.get('name');

  /* без параметров — покажем заглушку, но сначала попробуем понять, мой ли это профиль */
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ================= ПРОСМОТР ФОТО ================= */

  var viewer = {
    root:  document.getElementById('u-viewer'),
    img:   document.getElementById('u-viewer-img'),
    close: document.getElementById('u-viewer-close'),
    prev:  document.getElementById('u-viewer-prev'),
    next:  document.getElementById('u-viewer-next'),
    count: document.getElementById('u-viewer-count'),
    list:  [],
    idx:   0
  };

  function viewerPaint(){
    if(!viewer.list.length) return;
    viewer.img.src = viewer.list[viewer.idx];
    viewer.count.textContent = viewer.list.length > 1
      ? (viewer.idx + 1) + ' / ' + viewer.list.length
      : '';

    var many = viewer.list.length > 1;
    viewer.prev.hidden = !many;
    viewer.next.hidden = !many;
  }

  function viewerStep(delta){
    if(viewer.list.length < 2) return;
    viewer.idx = (viewer.idx + delta + viewer.list.length) % viewer.list.length;
    viewerPaint();
  }

  function openViewer(photos, start){
    if(!photos || !photos.length) return;

    viewer.list = photos.slice();
    viewer.idx  = start || 0;

    viewer.root.hidden = false;
    document.body.classList.add('modal-open');
    viewerPaint();
  }

  function closeViewer(){
    viewer.root.hidden = true;
    document.body.classList.remove('modal-open');
    viewer.img.removeAttribute('src');
  }

  viewer.close.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    closeViewer();
  });

  viewer.prev.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    viewerStep(-1);
  });

  viewer.next.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    viewerStep(1);
  });

  viewer.root.addEventListener('click', function(e){
    if(e.target === viewer.root) closeViewer();
  });

  document.addEventListener('keydown', function(e){
    if(viewer.root.hidden) return;
    if(e.key === 'Escape') closeViewer();
    if(e.key === 'ArrowLeft'){
      e.preventDefault();
      viewerStep(-1);
    }
    if(e.key === 'ArrowRight'){
      e.preventDefault();
      viewerStep(1);
    }
  });

  /* ================= ПРОФИЛЬ ================= */

  var myId = null;   /* id залогиненного пользователя, если он есть */

  function isMine(id){
    return !!myId && !!id && String(myId) === String(id);
  }

  function showActions(id){
    var acts = document.getElementById('u-actions');
    if(!acts) return;

    if(!isMine(id)){
      acts.hidden = true;
      return;
    }
    acts.hidden = false;
  }

  function start(){
    if(!uid && !name){
      /* зашли на /u.html без id — перекидываем на свой профиль */
      sb.auth.getSession().then(function(s){
        if(s.data && s.data.session && s.data.session.user){
          location.replace(base + '/u.html?id=' + s.data.session.user.id);
        } else {
          fail();
        }
      }).catch(fail);
      return;
    }

    var q = sb
      .from('profiles')
      .select('id,username,status,about,city,cover_url,fav_albums,gender,birthdate,avatar,created_at');

    q = uid ? q.eq('id', uid) : q.ilike('username', name);

    q.maybeSingle()
      .then(function(res){
        if(res.error || !res.data){ fail(); return; }
        var p = res.data;
        render(p);
        showActions(p.id);
        loadCollection(p.id);
        loadMedals(p.id);
      })
      .catch(function(){ fail(); });
  }

  sb.auth.getSession().then(function(s){
    if(s.data && s.data.session && s.data.session.user){
      myId = s.data.session.user.id;
    }
    start();
  }).catch(function(){
    start();
  });
