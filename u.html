<div class="profile-wrap">

  <p class="profile-note" id="u-loading">Загружаем профиль…</p>

  <div id="u-box" hidden>

    <div class="u-hero" id="u-hero">
      <div class="u-hero-inner">
        <img class="profile-avatar u-avatar" id="u-avatar" src="" alt="">

        <div class="profile-id">
          <div class="profile-username u-username" id="u-username">—</div>
          <div class="profile-status" id="u-status"></div>
          <div class="profile-since" id="u-since"></div>
        </div>
      </div>
    </div>

    <div class="u-meta" id="u-meta"></div>

    <h2 class="profile-sub">О себе</h2>
    <p class="profile-fav u-about" id="u-about">—</p>

    <h2 class="profile-sub">Любимые альбомы</h2>
    <div class="u-albums" id="u-albums"></div>

    <h2 class="profile-sub">Коллекция</h2>
    <div class="u-collection" id="u-collection"></div>

    <h2 class="profile-sub">Значки</h2>
    <div class="u-badges" id="u-badges"></div>

  </div>

  <p class="profile-note" id="u-error" hidden>Такого профиля нет.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://ojqefhakkmwmztxplcqv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AKddWEkn4NKRScV70we-dg_HDeKR-yZ';

  var GOBLIN_FILES = ['archer-f','archer-m','druid-f','druid-m','bard-f','bard-m',
                      'mage-f','mage-m','knight-f','knight-m','necro-f','necro-m'];

  var BADGES = {
    talker:    { icon: '🖤', name: 'Первый комментарий' },
    speaker:   { icon: '🗣️', name: 'Собеседник' },
    listener:  { icon: '🎧', name: 'Слушатель' },
    meloman:   { icon: '💿', name: 'Меломан' },
    collector: { icon: '📼', name: 'Коллекционер' },
    veteran:   { icon: '🕯️', name: 'Старожил' }
  };

  var KIND_NAMES = {
    music: 'Музыка',
    book:  'Книга',
    zine:  'Журнал',
    film:  'Фильм',
    other: 'Другое'
  };

  var KIND_ORDER = ['music','book','zine','film','other'];

  var loading = document.getElementById('u-loading');
  var box     = document.getElementById('u-box');
  var err     = document.getElementById('u-error');
  var base    = '{{ site.baseurl }}';

  function fail(){
    loading.hidden = true;
    box.hidden = true;
    err.hidden = false;
  }

  var params = new URLSearchParams(location.search);
  var uid    = params.get('id');
  var name   = params.get('name');

  if(!uid && !name){ fail(); return; }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var q = sb
    .from('profiles')
    .select('id,username,status,about,city,cover_url,fav_albums,gender,birthdate,avatar,created_at');

  q = uid ? q.eq('id', uid) : q.ilike('username', name);

  q.maybeSingle()
    .then(function(res){
      if(res.error || !res.data){ fail(); return; }
      var p = res.data;
      render(p);
      loadCollection(p.id);
      loadBadges(p.id);
    })
    .catch(function(){ fail(); });

  function render(p){
    loading.hidden = true;
    box.hidden = false;

    document.title = (p.username || 'Профиль') + ' — Atmospheric';

    /* ---- фон за аватаром ---- */
    var hero = document.getElementById('u-hero');
    if(p.cover_url){
      hero.style.backgroundImage = 'url("' + p.cover_url + '")';
      hero.classList.add('has-cover');
    }

    /* ---- аватар ---- */
    var av = document.getElementById('u-avatar');
    av.src = base + '/images/goblins/' + (GOBLIN_FILES[p.avatar] || GOBLIN_FILES[0]) + '.jpg';
    av.onerror = function(){ av.src = base + '/logo.png'; };

    /* ---- имя и статус ---- */
    document.getElementById('u-username').textContent = p.username || 'Без имени';
    document.getElementById('u-status').textContent   = p.status || '';

    var since = p.created_at ? new Date(p.created_at).toLocaleDateString('ru-RU') : '';
    document.getElementById('u-since').textContent = since ? 'На сайте с ' + since : '';

    /* ---- город, пол, возраст ---- */
    var meta = [];
    if(p.city) meta.push(p.city);
    if(p.gender === 'male')   meta.push('Мужской');
    if(p.gender === 'female') meta.push('Женский');
    if(p.birthdate){
      var b = new Date(p.birthdate);
      var now = new Date();
      var age = now.getFullYear() - b.getFullYear();
      var m = now.getMonth() - b.getMonth();
      if(m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
      if(age > 0 && age < 120) meta.push(age + ' ' + ageWord(age));
    }
    document.getElementById('u-meta').textContent = meta.join(' · ');

    /* ---- о себе ---- */
    var about = document.getElementById('u-about');
    if(p.about){
      about.textContent = p.about;
    } else {
      about.textContent = 'Не рассказал о себе.';
      about.classList.add('is-empty');
    }

    /* ---- три любимых альбома ---- */
    var wrap = document.getElementById('u-albums');
    wrap.innerHTML = '';
    var list = Array.isArray(p.fav_albums) ? p.fav_albums.slice(0, 3) : [];

    if(!list.length){
      wrap.innerHTML = '<p class="profile-fav is-empty">Не указаны.</p>';
    } else {
      list.forEach(function(a){
        var card = document.createElement('div');
        card.className = 'u-album';

        var img = document.createElement('img');
        img.className = 'u-album-cover';
        img.alt = '';
        if(a.cover){
          img.src = a.cover;
          img.onerror = function(){ img.classList.add('is-missing'); };
        } else {
          img.classList.add('is-missing');
        }

        var cap = document.createElement('div');
        cap.className = 'u-album-cap';

        var artist = document.createElement('div');
        artist.className = 'u-album-artist';
        artist.textContent = a.artist || '';

        var album = document.createElement('div');
        album.className = 'u-album-name';
        album.textContent = a.album || '';

        var shade = document.createElement('div');
        shade.className = 'u-album-shade';

        cap.appendChild(shade);
        cap.appendChild(artist);
        cap.appendChild(album);

        card.appendChild(img);
        card.appendChild(cap);
        wrap.appendChild(card);
      });

      /* ---- подгонка шрифта под ширину обложки ---- */
      requestAnimationFrame(function(){
        var caps = wrap.querySelectorAll('.u-album-artist, .u-album-name');
        for(var k = 0; k < caps.length; k++) fitText(caps[k]);
      });

      window.addEventListener('resize', function(){
        var caps = wrap.querySelectorAll('.u-album-artist, .u-album-name');
        for(var k = 0; k < caps.length; k++) fitText(caps[k]);
      });
    }
  }

  /* ---- уменьшение шрифта, пока строка не влезет ---- */
  function fitText(el){
    if(!el.dataset.max){
      el.dataset.max = parseFloat(getComputedStyle(el).fontSize);
    }
    var max = parseFloat(el.dataset.max);
    var min = Math.max(7, max * 0.6);
    var size = max;
    var guard = 0;

    el.style.fontSize = max + 'px';

    while(el.scrollWidth > el.clientWidth + 1 && size > min && guard < 80){
      size -= 0.5;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }

  /* ================= КОЛЛЕКЦИЯ ================= */
  function loadCollection(id){
    var wrap = document.getElementById('u-collection');
    if(!wrap) return;

    wrap.innerHTML = '<p class="profile-fav is-empty">Загружаем…</p>';

    sb.from('collection')
      .select('id,kind,artist,title,format,year,comment,photos,created_at')
      .eq('user_id', id)
      .order('created_at', { ascending: false })
      .then(function(res){
        if(res.error){ showCollectionEmpty(wrap, res.error.message); return; }
        renderCollection(wrap, res.data || []);
      })
      .catch(function(){ showCollectionEmpty(wrap); });
  }

  function showCollectionEmpty(wrap, msg){
    wrap.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'profile-fav is-empty';
    p.textContent = 'Пока пусто.';
    wrap.appendChild(p);
    if(msg && window.console) console.warn('collection:', msg);
  }

  function renderCollection(wrap, rows){
    wrap.innerHTML = '';

    if(!rows.length){
      showCollectionEmpty(wrap);
      return;
    }

    /* ---- счётчик по типам ---- */
    var counts = {};
    rows.forEach(function(r){
      var k = KIND_NAMES[r.kind] ? r.kind : 'other';
      counts[k] = (counts[k] || 0) + 1;
    });

    var stat = document.createElement('div');
    stat.className = 'u-col-stat';
    KIND_ORDER.forEach(function(k){
      if(!counts[k]) return;
      var s = document.createElement('span');
      s.className = 'u-col-stat-item';
      s.textContent = KIND_NAMES[k] + ' — ' + counts[k];
      stat.appendChild(s);
    });
    wrap.appendChild(stat);

    /* ---- сетка карточек ---- */
    var grid = document.createElement('div');
    grid.className = 'u-col-grid';

    rows.forEach(function(r){
      var card = document.createElement('div');
      card.className = 'u-col-card';

      var photos = Array.isArray(r.photos) ? r.photos : [];

      var media = document.createElement('div');
      media.className = 'u-col-media';

      if(photos.length){
        var img = document.createElement('img');
        img.className = 'u-col-img';
        img.src = photos[0];
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function(){
          img.classList.add('is-missing');
          img.removeAttribute('src');
        };
        media.appendChild(img);

        if(photos.length > 1){
          var more = document.createElement('span');
          more.className = 'u-col-more';
          more.textContent = '+' + (photos.length - 1);
          media.appendChild(more);
        }
      } else {
        media.classList.add('u-col-media--empty');
      }

      /* ---- миниатюры под фото ---- */
      if(photos.length > 1){
        var strip = document.createElement('div');
        strip.className = 'u-col-strip';

        photos.slice(1, 5).forEach(function(u){
          var t = document.createElement('img');
          t.className = 'u-col-thumb';
          t.src = u;
          t.alt = '';
          t.loading = 'lazy';
          strip.appendChild(t);
        });

        media.addEventListener('click', function(){ openViewer(photos, 0); });
        media.classList.add('is-clickable');
        media.appendChild(strip);
      }

      card.appendChild(media);

      var body = document.createElement('div');
      body.className = 'u-col-body';

      var k = document.createElement('div');
      k.className = 'u-col-kind';
      k.textContent = KIND_NAMES[r.kind] || 'Другое';

      var t = document.createElement('div');
      t.className = 'u-col-title';
      t.textContent = r.title || '';

      body.appendChild(k);
      body.appendChild(t);

      var sub = [r.artist, r.format, r.year].filter(Boolean).join(' · ');
      if(sub){
        var s = document.createElement('div');
        s.className = 'u-col-sub';
        s.textContent = sub;
        body.appendChild(s);
      }

      if(r.comment){
        var c = document.createElement('div');
        c.className = 'u-col-text';
        c.textContent = r.comment;
        body.appendChild(c);
      }

      card.appendChild(body);
      grid.appendChild(card);
    });

    wrap.appendChild(grid);
  }

  /* ================= ПРОСМОТР ФОТО ================= */
  function openViewer(photos, start){
    var i = start || 0;

    var ov = document.getElementById('u-viewer');
    if(!ov){
      ov = document.createElement('div');
      ov.id = 'u-viewer';
      ov.className = 'u-viewer';
      ov.hidden = true;

      var im = document.createElement('img');
      im.className = 'u-viewer-img';
      im.alt = '';

      var prev = document.createElement('button');
      prev.type = 'button';
      prev.className = 'u-viewer-nav u-viewer-prev';
      prev.textContent = '‹';

      var next = document.createElement('button');
      next.type = 'button';
      next.className = 'u-viewer-nav u-viewer-next';
      next.textContent = '›';

      var close = document.createElement('button');
      close.type = 'button';
      close.className = 'u-viewer-close';
      close.textContent = '×';

      ov.appendChild(im);
      ov.appendChild(prev);
      ov.appendChild(next);
      ov.appendChild(close);
      document.body.appendChild(ov);

      close.addEventListener('click', function(){ closeViewer(); });
      ov.addEventListener('click', function(e){
        if(e.target === ov) closeViewer();
      });
      prev.addEventListener('click', function(e){
        e.stopPropagation();
        i = (i - 1 + photos.length) % photos.length;
        paint();
      });
      next.addEventListener('click', function(e){
        e.stopPropagation();
        i = (i + 1) % photos.length;
        paint();
      });
      document.addEventListener('keydown', function(e){
        if(ov.hidden) return;
        if(e.key === 'Escape') closeViewer();
        if(e.key === 'ArrowLeft'){ i = (i - 1 + photos.length) % photos.length; paint(); }
        if(e.key === 'ArrowRight'){ i = (i + 1) % photos.length; paint(); }
      });

      function paint(){ im.src = photos[i]; }
      ov._paint = paint;
    }

    if(ov._photos !== photos){
      ov._photos = photos;
    }

    ov.hidden = false;
    ov.classList.add('is-open');
    document.body.classList.add('modal-open');
    ov._paint();
  }

  function closeViewer(){
    var ov = document.getElementById('u-viewer');
    if(!ov) return;
    ov.hidden = true;
    ov.classList.remove('is-open');
    document.body.classList.remove('modal-open');
  }

  /* ---- значки ---- */
  function loadBadges(id){
    var wrap = document.getElementById('u-badges');
    wrap.innerHTML = '';

    sb.from('profile_badges')
      .select('badge')
      .eq('user_id', id)
      .then(function(res){
        if(res.error || !res.data || !res.data.length){
          wrap.innerHTML = '<p class="profile-fav is-empty">Пока нет.</p>';
          return;
        }
        res.data.forEach(function(row){
          var b = BADGES[row.badge];
          if(!b) return;

          var el = document.createElement('span');
          el.className = 'u-badge';
          el.title = b.name;
          el.textContent = b.icon + ' ' + b.name;
          wrap.appendChild(el);
        });
      })
      .catch(function(){
        wrap.innerHTML = '<p class="profile-fav is-empty">Пока нет.</p>';
      });
  }

  function ageWord(n){
    var t = n % 10, h = n % 100;
    if(h >= 11 && h <= 14) return 'лет';
    if(t === 1) return 'год';
    if(t >= 2 && t <= 4) return 'года';
    return 'лет';
  }
})();
</script>
